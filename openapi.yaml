    delete:
      tags: [comments]
      summary: Remove the current user's reaction
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}/share-links:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    get:
      tags: [sharing]
      summary: List share links for a node (manage role or workspace owner/admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareLink" }
    post:
      tags: [sharing]
      summary: Create a share link. The raw token is returned once.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShareLinkRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateShareLinkResponse" }

  /share-links/{linkID}:
    parameters:
      - $ref: "#/components/parameters/linkID"
    patch:
      tags: [sharing]
