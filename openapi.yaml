  /nodes/{nodeID}/publish:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [sharing]
      summary: Publish (or re-publish) a node at a workspace-unique slug
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedPage" }
    delete:
      tags: [sharing]
      summary: Unpublish a node
      responses:
        "204": { description: No Content }

  /notifications:
    get:
      tags: [notifications]
      summary: List the current user's notifications (optionally ?workspace_id=)
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /notifications/read:
    post:
      tags: [notifications]
      summary: Mark all notifications read (optionally scoped to ?workspace_id=)
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No Content }

  /notifications/{notificationID}/read:
    parameters:
      - name: notificationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notifications]
      summary: Mark one notification read
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceID}/activity:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [notifications]
      summary: List recent activity events for a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

  /workspaces/{workspaceID}/search:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [search]
      summary: Full-text search over a workspace's nodes
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }

  /workspaces/{workspaceID}/saved-searches:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [search]
      summary: List the current user's saved searches in a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedSearch" }
    post:
      tags: [search]
      summary: Save a search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSavedSearchRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }

  /saved-searches/{searchID}:
    parameters:
      - name: searchID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [search]
      summary: Delete a saved search
      responses:
        "204": { description: No Content }

  /workspaces/{workspaceID}/automations:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [automations]
      summary: List automations in a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Automation" }
    post:
      tags: [automations]
      summary: Create an automation (disabled by default)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAutomationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }

  /automations/{automationID}:
    parameters:
      - $ref: "#/components/parameters/automationID"
    get:
      tags: [automations]
      summary: Get an automation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [automations]
      summary: Update an automation's trigger/conditions (bumps version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAutomationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
    delete:
      tags: [automations]
      summary: Soft-delete an automation
      responses:
        "204": { description: No Content }

  /automations/{automationID}/enable:
    parameters:
      - $ref: "#/components/parameters/automationID"
    post:
      tags: [automations]
      summary: Enable an automation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }

  /automations/{automationID}/disable:
    parameters:
      - $ref: "#/components/parameters/automationID"
    post:
      tags: [automations]
      summary: Disable an automation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }

  /automations/{automationID}/run:
    parameters:
      - $ref: "#/components/parameters/automationID"
    post:
      tags: [automations]
      summary: >
        Queue a manual run. Persists an automation_runs row and a jobs row;
        execution is a separate worker (not implemented — see SCHEMA.md §8).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "201":
          description: Created (queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRun" }

  /automations/{automationID}/runs:
    parameters:
      - $ref: "#/components/parameters/automationID"
    get:
      tags: [automations]
      summary: List recent runs (most recent 50)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }

  /workspaces/{workspaceID}/webhooks:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [webhooks]
      summary: List webhooks in a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
    post:
      tags: [webhooks]
      summary: Create a webhook. The signing secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateWebhookResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /webhooks/{webhookID}:
    parameters:
      - $ref: "#/components/parameters/webhookID"
    get:
      tags: [webhooks]
      summary: Get a webhook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [webhooks]
      summary: Update a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebhookRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
    delete:
      tags: [webhooks]
      summary: Soft-delete a webhook
      responses:
        "204": { description: No Content }

  /webhooks/{webhookID}/deliveries:
    parameters:
      - $ref: "#/components/parameters/webhookID"
    get:
      tags: [webhooks]
      summary: List recent delivery attempts (most recent 50)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookDelivery" }

  /workspaces/{workspaceID}/presence:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [collaboration]
      summary: >
        List recent presence (last 5 minutes) across a workspace. Recovery/hydration
        data only — live cursors are Redis pub/sub, not this endpoint (SCHEMA.md §6.14).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Presence" }

  /nodes/{nodeID}/presence:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    get:
      tags: [collaboration]
      summary: List recent presence on a node
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Presence" }
    put:
      tags: [collaboration]
      summary: Upsert the current user's presence on a node
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutPresenceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Presence" }
    delete:
      tags: [collaboration]
      summary: Clear the current user's presence on a node (leaving)
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{nodeID}/ws:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    get:
      tags: [collaboration]
      summary: Upgrade to a WebSocket carrying live presence and Yjs document sync for this node
      description: >
        Not a JSON endpoint — upgrades per RFC 6455 (requires the session cookie;
        authorization is checked before the handshake completes since there is
        no clean way to return an HTTP error afterward). One connection per
        node multiplexes two kinds of frames:

        Text frames are a small JSON control protocol: client sends
        `{"type":"hello","client_id":"..."}` once, then optionally
        `{"type":"presence","selection":...,"cursor":...,"viewport":...}`
        (throttled server-side to 1/second); the server sends one
        `{"type":"sync","snapshot":base64|null,"updates":[base64,...]}` right
        after connecting, then `{"type":"presence","user_id":...,...}` when
        other participants move.

        Binary frames carry raw Yjs update bytes in both directions — the
        server persists and relays them without decoding; CRDT merge happens
        client-side in Yjs (see DEPENDENCIES.md §37, SCHEMA.md §8).
      responses:
        "101": { description: Switching Protocols — WebSocket established }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: flow_session
      description: >
        Set by POST /auth/login. Mutating requests also require the
        X-CSRF-Token header to match the flow_csrf cookie.

  parameters:
    workspaceID:
      name: workspaceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    spaceID:
      name: spaceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    nodeID:
      name: nodeID
      in: path
      required: true
      schema: { type: string, format: uuid }
    pageID:
      name: pageID
      in: path
      required: true
      schema: { type: string, format: uuid }
    blockID:
      name: blockID
      in: path
      required: true
      schema: { type: string, format: uuid }
    userID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    databaseID:
      name: databaseID
      in: path
      required: true
      schema: { type: string, format: uuid }
    fieldID:
      name: fieldID
      in: path
      required: true
      schema: { type: string, format: uuid }
    recordID:
      name: recordID
      in: path
      required: true
      schema: { type: string, format: uuid }
    viewID:
      name: viewID
      in: path
      required: true
      schema: { type: string, format: uuid }
    projectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    taskID:
      name: taskID
      in: path
      required: true
      schema: { type: string, format: uuid }
    canvasID:
      name: canvasID
      in: path
      required: true
      schema: { type: string, format: uuid }
    objectID:
      name: objectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    connectorID:
      name: connectorID
      in: path
      required: true
      schema: { type: string, format: uuid }
    fileID:
      name: fileID
      in: path
      required: true
      schema: { type: string, format: uuid }
    discussionID:
      name: discussionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    commentID:
      name: commentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    linkID:
      name: linkID
      in: path
      required: true
      schema: { type: string, format: uuid }
    automationID:
      name: automationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    webhookID:
      name: webhookID
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Sign in required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    OKResponse:
      type: object
      properties:
        ok: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        email_verified: { type: boolean }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        display_name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 128 }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        username: { type: string, nullable: true }
        locale: { type: string }
        timezone: { type: string }
        week_starts_on: { type: integer, minimum: 0, maximum: 6 }
        date_format: { type: string }
        time_format: { type: string }
        theme: { type: string, enum: [system, light, dark, amoled] }
        bio: { type: string }
        avatar_object_key: { type: string, nullable: true }

    UpdateProfileRequest:
      type: object
      properties:
        display_name: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        username: { type: string }
        locale: { type: string }
        timezone: { type: string }
        week_starts_on: { type: integer, minimum: 0, maximum: 6 }
        date_format: { type: string }
        time_format: { type: string }
        theme: { type: string, enum: [system, light, dark, amoled] }
        bio: { type: string }

    Preferences:
      type: object
      properties:
        editor: { type: object }
        notifications: { type: object }
        accessibility: { type: object }
        shortcuts: { type: object }
        extras: { type: object }
        updated_at: { type: string, format: date-time }

    UpdatePreferencesRequest:
      type: object
      properties:
        editor: { type: object }
        notifications: { type: object }
        accessibility: { type: object }
        shortcuts: { type: object }
        extras: { type: object }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        ip: { type: string }
        country: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }

    Workspace:
      type: object
      required:
        - id
        - name
        - description
        - status
        - settings
        - public_sharing_enabled
        - guest_access_enabled
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, nullable: true }
        description: { type: string }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        status: { type: string }
        settings: { type: object }
        owner_user_id: { type: string, format: uuid, nullable: true }
        public_sharing_enabled: { type: boolean }
        guest_access_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon: { type: string }
        color: { type: string }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        color: { type: string }
        public_sharing_enabled: { type: boolean }
        guest_access_enabled: { type: boolean }

    Usage:
      type: object
      properties:
