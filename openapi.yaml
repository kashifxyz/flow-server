openapi: 3.1.0
info:
  title: Flow API
  description: >
    Flow is a self-hosted unified workspace (documents, structured data, projects,
    canvas, files, automation) built around one identity graph (`nodes`).
    Authentication is cookie-based (session + CSRF); most endpoints require an
    authenticated session and workspace membership.
  version: "0.1.0"
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: users
  - name: workspaces
  - name: spaces
  - name: nodes
  - name: pages
  - name: blocks
  - name: databases
  - name: records
  - name: views
  - name: projects
  - name: tasks
  - name: canvases
  - name: files
  - name: comments
  - name: sharing
  - name: notifications
  - name: search
  - name: automations
  - name: webhooks
  - name: collaboration

security:
  - sessionCookie: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account. Sends a verification email; does not sign in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OKResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: An account with this email already exists }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in. Sets the session and CSRF cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid credentials, unverified email, locked, or disabled account }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session and clear auth cookies
      responses:
        "204": { description: No Content }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Consume an email-verification token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OKResponse" }
        "400": { description: Invalid or expired token }

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend the verification email (always 204, does not reveal whether the address exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "204": { description: No Content }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset email (always 204, does not reveal whether the address exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "204": { description: No Content }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Consume a password-reset token and set a new password. Revokes all existing sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OKResponse" }
        "400": { description: Invalid/expired token, or password reused }

  /users/me:
    patch:
      tags: [users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "409": { description: Username already taken }

  /users/me/preferences:
    get:
      tags: [users]
      summary: Get the current user's preferences (editor, notifications, accessibility, shortcuts)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
    patch:
      tags: [users]
      summary: Update the current user's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePreferencesRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }

  /users/me/sessions:
    get:
      tags: [users]
      summary: List the current user's active sessions, most recently active first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /users/me/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [users]
      summary: Revoke one of the current user's other sessions ("sign out this device")
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces the current user belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workspaces/{workspaceID}:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [workspaces]
      summary: Get a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workspaces]
      summary: Update a workspace (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspaces]
      summary: Soft-delete a workspace (owner only)
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceID}/usage:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [workspaces]
      summary: Storage and seat usage for a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /workspaces/{workspaceID}/members:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [workspaces]
      summary: List members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workspaces]
      summary: Add an existing user to the workspace by email (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
      - $ref: "#/components/parameters/userID"
    patch:
      tags: [workspaces]
      summary: Update a member's role/seat/status (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspaces]
      summary: Remove a member (owner/admin)
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceID}/invites:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [workspaces]
      summary: List pending invites (owner/admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workspaces]
      summary: Create an invite (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Created — includes the raw invite token once
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Invite" }
                  - type: object
                    properties:
                      token: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /workspaces/{workspaceID}/invites/{inviteID}:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
      - name: inviteID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [workspaces]
      summary: Revoke an invite (owner/admin)
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /invites/{token}/accept:
    post:
      tags: [workspaces]
      summary: Accept an invite as the current user
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OKResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceID}/roles:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [workspaces]
      summary: List custom roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
    post:
      tags: [workspaces]
      summary: Create a custom role (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }

  /workspaces/{workspaceID}/roles/{roleID}:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
      - name: roleID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      summary: Update a custom role (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspaces]
      summary: Delete a custom role (owner/admin)
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceID}/groups:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [workspaces]
      summary: List groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [workspaces]
      summary: Create a group (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /workspaces/{workspaceID}/groups/{groupID}:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
      - name: groupID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      summary: Update a group (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
    delete:
      tags: [workspaces]
      summary: Delete a group (owner/admin)
      responses:
        "204": { description: No Content }

  /workspaces/{workspaceID}/groups/{groupID}/members:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
      - name: groupID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workspaces]
      summary: List group members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupMember" }
    post:
      tags: [workspaces]
      summary: Add a group member (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddGroupMemberRequest" }
      responses:
        "204": { description: No Content }

  /workspaces/{workspaceID}/groups/{groupID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
      - name: groupID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/userID"
    delete:
      tags: [workspaces]
      summary: Remove a group member (owner/admin)
      responses:
        "204": { description: No Content }

  /workspaces/{workspaceID}/domains:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [workspaces]
      summary: List verified join domains
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Domain" }
    post:
      tags: [workspaces]
      summary: Add a domain (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDomainRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }

  /workspaces/{workspaceID}/domains/{domainID}:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
      - name: domainID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [workspaces]
      summary: Remove a domain (owner/admin)
      responses:
        "204": { description: No Content }

  /workspaces/{workspaceID}/spaces:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [spaces]
      summary: List spaces visible to the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Space" }
    post:
      tags: [spaces]
      summary: Create a space
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSpaceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }

  /spaces/{spaceID}:
    parameters:
      - $ref: "#/components/parameters/spaceID"
    get:
      tags: [spaces]
      summary: Get a space
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [spaces]
      summary: Update a space (space admin or workspace owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
    delete:
      tags: [spaces]
      summary: Delete a non-default space
      responses:
        "204": { description: No Content }

  /spaces/{spaceID}/members:
    parameters:
      - $ref: "#/components/parameters/spaceID"
    get:
      tags: [spaces]
      summary: List space members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpaceMember" }
    post:
      tags: [spaces]
      summary: Add a space member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSpaceMemberRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceMember" }

  /spaces/{spaceID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/spaceID"
      - $ref: "#/components/parameters/userID"
    patch:
      tags: [spaces]
      summary: Update a space member's role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceMemberRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceMember" }
    delete:
      tags: [spaces]
      summary: Remove a space member
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    get:
      tags: [nodes]
      summary: Get any node by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [nodes]
      summary: Update generic node fields (title/description/icon/props/rank/space)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNodeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
    delete:
      tags: [nodes]
      summary: Soft-delete a node (moves to trash)
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}/move:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [nodes]
      summary: Move a node to a new parent/rank
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveNodeRequest" }
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}/archive:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [nodes]
      summary: Archive a node
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}/restore:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [nodes]
      summary: Restore a soft-deleted node from trash
      responses:
        "204": { description: No Content }

  /workspaces/{workspaceID}/trash:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [nodes]
      summary: List trashed nodes in a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashItem" }

  /nodes/{nodeID}/permissions:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    get:
      tags: [nodes]
      summary: List a node's ACL entries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Permission" }
    put:
      tags: [nodes]
      summary: Replace a node's ACL entries (manage role or workspace owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPermissionsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Permission" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /nodes/{nodeID}/star:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [nodes]
      summary: Star a node
      responses:
        "204": { description: No Content }
    delete:
      tags: [nodes]
      summary: Unstar a node
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}/pin:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [nodes]
      summary: Pin a node
      responses:
        "204": { description: No Content }
    delete:
      tags: [nodes]
      summary: Unpin a node
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}/watch:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [nodes]
      summary: Watch a node for updates
      responses:
        "204": { description: No Content }
    delete:
      tags: [nodes]
      summary: Unwatch a node
      responses:
        "204": { description: No Content }

  /nodes/{nodeID}/visit:
    parameters:
      - $ref: "#/components/parameters/nodeID"
    post:
      tags: [nodes]
      summary: Record a visit (recents)
      responses:
        "204": { description: No Content }

  /workspaces/{workspaceID}/pages:
    parameters:
      - $ref: "#/components/parameters/workspaceID"
    get:
      tags: [pages]
      summary: List pages in a workspace (flat; build the tree from parent_id)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Page" }
    post:
      tags: [pages]
      summary: Create a page
