            schema: { $ref: "#/components/schemas/CreateDiscussionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discussion" }

  /discussions/{discussionID}:
    parameters:
      - $ref: "#/components/parameters/discussionID"
    get:
      tags: [comments]
      summary: Get a discussion thread
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discussion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /discussions/{discussionID}/resolve:
    parameters:
      - $ref: "#/components/parameters/discussionID"
    post:
      tags: [comments]
      summary: Mark a discussion resolved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discussion" }

  /discussions/{discussionID}/comments:
    parameters:
      - $ref: "#/components/parameters/discussionID"
    get:
      tags: [comments]
      summary: List comments in a discussion thread
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
    post:
      tags: [comments]
      summary: Add a comment to a discussion (optionally a threaded reply via parent_id)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /comments/{commentID}:
    parameters:
      - $ref: "#/components/parameters/commentID"
    patch:
      tags: [comments]
      summary: Edit a comment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
    delete:
      tags: [comments]
      summary: Soft-delete a comment
      responses:
        "204": { description: No Content }

  /comments/{commentID}/reactions:
    parameters:
      - $ref: "#/components/parameters/commentID"
    post:
      tags: [comments]
      summary: React to a comment with an emoji
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReactionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reaction" }

  /comments/{commentID}/reactions/{reactionID}:
    parameters:
      - $ref: "#/components/parameters/commentID"
