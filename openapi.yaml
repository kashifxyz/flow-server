        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateShareLinkRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sharing]
